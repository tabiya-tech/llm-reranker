# Ruff configuration for the LLM Re-ranker project.
# Docs: https://docs.astral.sh/ruff/
#
# Linting is enforced in CI (`ruff check`). Formatting is checked but currently
# advisory (`ruff format --check` is non-blocking) so the existing hand-aligned
# style can be migrated deliberately rather than in one large reformat.
#
# Mirrors the proven sibling `scraper/ruff.toml` — same rule selection, same
# pragmatic ignores, adjusted for this project (Python 3.11 runtime, see
# `Dockerfile` and `requirements.txt`).

target-version = "py311"
line-length = 100

# Vendored virtualenvs, generated caches, the IaC sub-projects' venvs, notebooks,
# and resource data files (CSV / JSON / Markdown prompt templates) are not ours
# to lint or format.
extend-exclude = [
    "**/venv",
    "**/.venv",
    "iac/**/venv",
    "iac/**/.venv",
    "*.ipynb",
    "resources",
]

[lint]
# F (pyflakes): undefined names, unused imports/variables.
# E4/E7/E9 (pycodestyle): import placement, syntax errors, and similar.
# I (isort): consistent import ordering.
# B (flake8-bugbear): likely bugs the rules above miss, e.g. mutable default
#   arguments, loop variables captured by a closure, missing exception context.
# ANN401: disallows `Any` as a function parameter or return type (does not
#   apply to `dict[str, Any]` used as a variable/field type).
select = ["E4", "E7", "E9", "F", "I", "B", "ANN401"]

# E402 — `app/config.py` calls `load_dotenv()` at module level, which ruff
# treats as code preceding an import.
# E701 — compact one-line `if cond: return X` mappings (e.g. cell parsers,
# short helper tables) are intentional and readable here.
ignore = ["E402", "E701"]

[lint.flake8-annotations]
# Exempts `*args: Any` / `**kwargs: Any` from ANN401. A passthrough `**kwargs`
# forwarded to another function has no narrower correct type, so without this
# ANN401 would flag normal, correct code. A regular parameter typed `Any`
# is still flagged.
allow-star-arg-any = true

[lint.per-file-ignores]
# Test modules may keep unused imports for fixtures/parametrization clarity.
"tests/*" = []

[format]
quote-style = "preserve"

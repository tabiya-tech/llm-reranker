name: Reranker CI

on:
  workflow_call:
    inputs:
      upload-artifacts:
        required: true
        type: boolean
        description: "Whether to build and push Docker images"
      stack:
        required: false
        type: string
        default: dev
        description: "Stack name (used as GitHub environment for secrets)"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff>=0.15,<0.16"

      # Enforcing: fails the job on lint violations.
      - name: Ruff lint
        run: ruff check --output-format=github .

      # Enforcing: fails the job on formatting drift. The codebase was
      # formatted in one pass with `ruff format .` so this is now safe to
      # treat as a hard check, matching the local `scripts/run_all_checks.py`
      # runner.
      - name: Ruff format check
        run: ruff format --check --diff .

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # `pytest.ini` defines `testpaths = tests` and `addopts = -ra --strict-markers`.
        run: python -m pytest -v

  build-and-push:
    name: Build & push reranker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: inputs.upload-artifacts
    environment: ${{ inputs.stack }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/job-pipeline"
          docker build \
            --platform=linux/amd64 \
            -t ${REGISTRY}/llm-reranker:${{ github.sha }} \
            -t ${REGISTRY}/llm-reranker:latest \
            -t ${REGISTRY}/llm-reranker:service \
            .

      - name: Push Docker image
        run: |
          REGISTRY="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/job-pipeline"
          docker push ${REGISTRY}/llm-reranker:${{ github.sha }}
          docker push ${REGISTRY}/llm-reranker:latest
          docker push ${REGISTRY}/llm-reranker:service
          echo "IMAGE_JOB=${REGISTRY}/llm-reranker:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "IMAGE_SERVICE=${REGISTRY}/llm-reranker:service" >> $GITHUB_STEP_SUMMARY

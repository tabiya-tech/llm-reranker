[pytest]
# Single-command test runner for the LLM Re-ranker.
#
# From llm-reranker/, just run:
#
#     pytest
#
# That's it. No flags or paths needed — `testpaths` and `addopts` below are
# applied automatically. CI uses the same invocation
# (see .github/workflows/reranker-ci.yml).

# Only collect the project's test suite; never descend into the Pulumi IaC
# virtualenvs, build caches, or the resources data directory.
testpaths = tests
norecursedirs = iac .git .pytest_cache __pycache__ resources *venv* node_modules

python_files = test_*.py

# -ra              : show short summary for everything except passes
# --strict-markers : fail if a test uses an unregistered @pytest.mark.<name>
addopts = -ra --strict-markers

markers =
    integration: per-job pipeline test that wires multiple modules together (Gemini stubbed, no Mongo)
    unit: fast, pure, deterministic test with no external dependencies
